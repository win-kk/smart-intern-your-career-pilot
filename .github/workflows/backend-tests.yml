name: Backend tests
on:
  push:
    branches: [main]
    paths: ['backend/**', 'package.json', 'package-lock.json', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', 'package.json', 'package-lock.json', '.github/workflows/backend-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
